<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Theme-adaptive favicon: neutral on light, inverts on dark -->
  <style>
    .ink { fill: #0a0a0a; }
    .ring { stroke: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #fafafa; }
      .ring { stroke: #fafafa; }
    }
  </style>
  <!-- Concentric portal rings behind plane -->
  <g fill="none" stroke-linecap="round" class="ring">
    <circle cx="256" cy="256" r="200" stroke-width="6" opacity="0.18"/>
    <circle cx="256" cy="256" r="150" stroke-width="6" opacity="0.32"/>
    <circle cx="256" cy="256" r="100" stroke-width="6" opacity="0.5"/>
  </g>
  <!-- Origami paper plane, body + folded inner wing -->
  <g class="ink">
    <path d="M110 350 L430 130 L290 380 L240 300 Z"/>
    <path d="M240 300 L430 130 L290 250 Z" opacity="0.55"/>
  </g>
</svg>
