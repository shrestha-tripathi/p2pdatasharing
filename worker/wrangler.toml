name = "local-teleport-signaling"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Durable Objects — one instance per room (room ID becomes the DO ID).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

# Migration: register the DO class so Cloudflare provisions storage.
[[migrations]]
tag = "v1"
new_classes = ["RoomDO"]

# Allow any browser origin to upgrade WS — adjust for production if you
# want to lock it down to a specific domain.
[vars]
ALLOWED_ORIGIN = "*"
