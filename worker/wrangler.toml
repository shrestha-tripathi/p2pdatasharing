name = "p2pdatasharing"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Durable Objects — one instance per room (room ID becomes the DO ID).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDO"

# CodeDO — global short-code pairing. Single instance worldwide
# (idFromName("global-v1")). Holds in-memory `code → roomId` map
# for 4-char Crockford Base32 codes with 60s TTL.
[[durable_objects.bindings]]
name = "CODES"
class_name = "CodeDO"

# Migration: register the DO class so Cloudflare provisions storage.
# Using new_sqlite_classes so this works on Workers Free plan (the old
# new_classes form requires a paid Workers plan as of 2024).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LobbyDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CodeDO"]

# Public, non-secret config. These are versioned in source and re-applied
# on every `wrangler deploy` — they CANNOT silently reset like secrets can.
#
# If you need to change values per-env (dev/staging/prod), use:
#   [env.staging.vars] / [env.production.vars]
#
# DO NOT put secrets here. Use `wrangler secret put NAME` for those.
# (Currently only TURN_SHARED_SECRET is a true secret — see worker/.dev.vars.example.)
[vars]
# WebSocket origin allowlist for /signal (handled in RoomDO). "*" = any.
ALLOWED_ORIGIN = "*"
# Comma-separated Origin allowlist for /turn — blocks drive-by scraping of
# our TURN credentials. Spoofable by curl, but stops browser-tab attacks.
ALLOWED_ORIGINS = "https://filetransfernow.com,https://www.filetransfernow.com,http://localhost:4321"
# Self-hosted coturn domain. TURN_SHARED_SECRET (the HMAC key) is set as a
# real secret separately; see worker/scripts/restore-prod-secrets.sh.
TURN_DOMAIN = "turn.filetransfernow.com"
